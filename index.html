<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlimited Handwritten Signature Generator</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Akshar:wght@300;600;700&family=Amita:wght@700&family=Arya:wght@700&family=Kalam:wght@300;700&family=Mukta:wght@300;800&family=Poppins:ital,wght@0,300;1,300&family=Sacramento&family=Great+Vibes&family=Pacifico&family=Caveat&family=Courgette&family=Marck+Script&family=Cambay:wght@700&family=Glegoo:wght@700&family=Eczar:wght@600&family=Satisfy&family=Cookie&family=Parisienne&family=Allura&family=Alex+Brush&family=Petit+Formal+Script&family=Italianno&family=Clicker+Script&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .mainsec {
            max-width: 950px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        h1 {
            text-align: center;
            color: #000F55;
            margin-bottom: 5px;
        }
        .headsupport {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }
        .uperdigtwrp {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }
        .inptxtwrp {
            width: 100%;
            max-width: 500px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #007bff;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .dfontcnt {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            min-height: 120px;
        }
        .uperxbarsec {
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #777;
            margin-bottom: 10px;
        }
        .xdisplaydiv {
            margin: 15px 0;
            text-align: center;
            width: 100%;
            overflow: hidden;
        }
        .fnamrx {
            font-size: 32px;
            display: inline-block;
            transition: transform 0.2s;
        }
        .bottomxbtnx {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }
        input[type="color"] {
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }
        .downxbtn {
            background-color: #007bff;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        .downxbtn:hover {
            background-color: #0056b3;
        }
        #loadMoreBTN {
            display: none;
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s;
        }
        #loadMoreBTN:hover {
            background-color: #218838;
        }
        .placeholder-msg {
            text-align: center;
            color: #888;
            font-size: 16px;
            margin: 30px 0;
        }
    </style>
</head>
<body>

<div class="mainsec">
    <h1>Signature Generator</h1>
    <p class="headsupport">6G Super-Fast ⚡</p>
    
    <div class="uperdigtwrp">
        <div class="inptxtwrp">
            <input id="textname" type="text" placeholder="Eample : Rohit या रोहित " autocomplete="off">
        </div>
    </div>

    <!-- Signatures Grid -->
    <div id="digsignbody" class="grid-container"></div>

    <div id="bottomCNT">
        <button id="loadMoreBTN" onclick="loadMoreSignatures()">Load More Signatures</button>
    </div>
</div>

<script>
    // Comprehensive Anti-Inspect & DevTools Protection
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });

    document.addEventListener('keydown', function(e) {
        // Block F12
        if (e.key === 'F12' || e.keyCode === 123) {
            e.preventDefault();
            window.location.reload();
        }
        // Block Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C
        if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c' || e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) {
            e.preventDefault();
            window.location.reload();
        }
        // Block Ctrl+U (View Source)
        if (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.keyCode === 85)) {
            e.preventDefault();
            window.location.reload();
        }
    });

    // Infinite Debugger Trap to block inspection tools
    setInterval(function() {
        const startTime = performance.now();
        debugger;
        const endTime = performance.now();
        if (endTime - startTime > 100) {
            window.location.reload();
        }
    }, 1000);

    const baseFonts = [
        "Akshar", "Amita", "Arya", "Kalam", "Mukta", 
        "Poppins", "Sacramento", "Great Vibes", "Pacifico", 
        "Caveat", "Courgette", "Marck Script", "Cambay", 
        "Glegoo", "Eczar", "Satisfy", "Cookie", "Parisienne", 
        "Allura", "Alex Brush", "Petit Formal Script", "Italianno", "Clicker Script"
    ];

    let currentLimit = 6; // Pehle 6 dikhenge
    const textInput = document.getElementById('textname');
    const signBody = document.getElementById('digsignbody');
    const loadMoreBtn = document.getElementById('loadMoreBTN');

    function renderSignatures() {
        const nameVal = textInput.value.trim();
        
        if (nameVal === "") {
            signBody.innerHTML = `<div class="placeholder-msg">Please type a name above to generate signatures.</div>`;
            loadMoreBtn.style.display = 'none';
            return;
        }

        signBody.innerHTML = "";
        
        // Unlimited loop create karne ke liye hum base fonts ko repeat aur variations ke sath generate karenge
        let generatedCount = 0;
        for (let i = 0; i < currentLimit; i++) {
            let fontIndex = i % baseFonts.length;
            let font = baseFonts[fontIndex];
            
            // Har round mein thoda unique look dene ke liye variations (italic, spacing, tilt) add karenge
            let isItalic = (i % 3 === 0) ? 'italic' : 'normal';
            let letterSpacing = (i % 2 === 0) ? '0px' : '1px';
            let skewAngle = (i % 4 === 0) ? '-5deg' : '0deg';

            const card = document.createElement('div');
            card.className = 'dfontcnt';

            card.innerHTML = `
                <div class="uperxbarsec">
                    <span>Style #${i + 1} (${font})</span>
                    <span style="cursor:pointer;" title="Rotate" onclick="rotateSig(this)">🔄</span>
                </div>
                <div class="xdisplaydiv">
                    <span class="fnamrx" style="font-family: '${font}', cursive, sans-serif; font-style: ${isItalic}; letter-spacing: ${letterSpacing}; transform: skewX(${skewAngle}); color: #000F55;">${nameVal}</span>
                </div>
                <div class="bottomxbtnx">
                    <input value="#000F55" title="Change Color" type="color" oninput="changeColor(this)">
                    <span class="downxbtn" onclick="downloadSignature(this, '${font}', ${i + 1})">📥 Download</span>
                </div>
            `;
            signBody.appendChild(card);
        }

        // Load More button hamesha visible rahega taaki aap unlimited bar click kar sakein
        loadMoreBtn.style.display = 'block';
    }

    textInput.addEventListener('input', () => {
        currentLimit = 6; // Naya naam daalne par reset
        renderSignatures();
    });

    function loadMoreSignatures() {
        currentLimit += 6; // Har click par 6 aur naye signature cards add ho jayenge (Unlimited)
        renderSignatures();
    }

    function changeColor(colorInput) {
        const card = colorInput.closest('.dfontcnt');
        const textSpan = card.querySelector('.fnamrx');
        textSpan.style.color = colorInput.value;
    }

    function rotateSig(spanElem) {
        const card = spanElem.closest('.dfontcnt');
        const textSpan = card.querySelector('.fnamrx');
        let currentRot = textSpan.getAttribute('data-rotate') || 0;
        currentRot = (parseInt(currentRot) + 10) % 360;
        textSpan.setAttribute('data-rotate', currentRot);
        textSpan.style.transform = `rotate(${currentRot}deg)`;
    }

    function downloadSignature(btnElem, fontName, index) {
        const card = btnElem.closest('.dfontcnt');
        const textSpan = card.querySelector('.fnamrx');
        const text = textSpan.innerText;
        const color = textSpan.style.color;

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 600;
        canvas.height = 200;

        ctx.font = `bold 50px "${fontName}", cursive, sans-serif`;
        ctx.fillStyle = color;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, canvas.width / 2, canvas.height / 2);

        const link = document.createElement('a');
        link.download = `signature_${index}_${fontName}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    }

    renderSignatures();
</script>

</body>
</html>
